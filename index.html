    <script>
        let audioCtx = null;
        let masterGain = null;
        let soundSourceNode = null;
        let soundFilter = null;
        let soundLfo = null;
        let soundLfoGain = null;
        let currentSoundType = 'rain';
        let isAudioInitialized = false;

        function initAudioContext() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return;
            }
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);
        }

        function stopCurrentSound() {
            try {
                if (soundSourceNode) {
                    soundSourceNode.stop();
                    soundSourceNode.disconnect();
                    soundSourceNode = null;
                }
                if (soundLfo) {
                    soundLfo.stop();
                    soundLfo.disconnect();
                    soundLfo = null;
                }
                if (soundFilter) {
                    soundFilter.disconnect();
                    soundFilter = null;
                }
            } catch (e) {
                console.log("Stop sound error:", e);
            }
        }

        function playSoundscape(type) {
            initAudioContext();
            stopCurrentSound();
            currentSoundType = type;

            ['rain', 'fire', 'stream', 'wind', 'mute'].forEach(t => {
                const btn = document.getElementById('btn-' + t);
                if (btn) {
                    if (t === type) {
                        btn.className = "text-white font-semibold underline underline-offset-4";
                    } else {
                        btn.className = "text-neutral-200 hover:text-white transition-colors";
                    }
                }
            });

            if (type === 'mute') return;

            try {
                const bufferSize = audioCtx.sampleRate * 8;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);

                if (type === 'rain') {
                    let b0 = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        b0 = 0.95 * b0 + white * 0.05;
                        output[i] = b0 * 0.04;
                    }
                } else if (type === 'fire') {
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        if (Math.random() < 0.0007) white *= 9.0;
                        output[i] = white * 0.032;
                    }
                } else if (type === 'stream') {
                    let b0 = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        b0 = 0.99 * b0 + white * 0.08;
                        output[i] = b0 * 0.045;
                    }
                } else if (type === 'wind') {
                    let b0 = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        b0 = 0.995 * b0 + white * 0.05;
                        output[i] = b0 * 0.05;
                    }
                }

                soundSourceNode = audioCtx.createBufferSource();
                soundSourceNode.buffer = buffer;
                soundSourceNode.loop = true;

                soundFilter = audioCtx.createBiquadFilter();
                soundFilter.type = 'lowpass';

                if (type === 'rain') {
                    soundFilter.frequency.setValueAtTime(1400, audioCtx.currentTime);
                    soundFilter.Q.setValueAtTime(1.2, audioCtx.currentTime);
                } else if (type === 'fire') {
                    soundFilter.frequency.setValueAtTime(750, audioCtx.currentTime);
                    soundFilter.Q.setValueAtTime(2.0, audioCtx.currentTime);
                } else if (type === 'stream') {
                    soundFilter.frequency.setValueAtTime(2200, audioCtx.currentTime);
                    soundFilter.Q.setValueAtTime(2.5, audioCtx.currentTime);
                } else if (type === 'wind') {
                    soundFilter.frequency.setValueAtTime(280, audioCtx.currentTime);
                    soundFilter.Q.setValueAtTime(4.5, audioCtx.currentTime);

                    soundLfo = audioCtx.createOscillator();
                    soundLfo.type = 'sine';
                    soundLfo.frequency.setValueAtTime(0.08, audioCtx.currentTime);

                    soundLfoGain = audioCtx.createGain();
                    soundLfoGain.gain.setValueAtTime(120, audioCtx.currentTime);

                    soundLfo.connect(soundLfoGain);
                    soundLfoGain.connect(soundFilter.frequency);
                    soundLfo.start(0);
                }

                soundSourceNode.connect(soundFilter);
                soundFilter.connect(masterGain);
                soundSourceNode.start(0);
                isAudioInitialized = true;
            } catch (e) {
                console.log("Play soundscape error:", e);
            }
        }

        function setSoundscape(type) {
            playSoundscape(type);

        let bgSlideInterval = null;

        function isVideoUrl(url) {
            if (!url) return false;
            const lower = url.toLowerCase();
            return lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.endsWith('.mov') || lower.endsWith('.ogg');
        }

        function setAmbientMedia(url, solidColor = null) {
            const imgEl = document.getElementById('ambient-img');
            const videoEl = document.getElementById('ambient-video');
            const ambientBg = document.getElementById('ambient-bg');
            if (!imgEl || !videoEl || !ambientBg) return;

            if (solidColor) {
                videoEl.style.opacity = '0';
                imgEl.style.opacity = '0';
                videoEl.pause();
                ambientBg.style.backgroundColor = solidColor;
                return;
            } else {
                ambientBg.style.backgroundColor = 'transparent';
            }

            if (isVideoUrl(url)) {
                videoEl.src = url;
                videoEl.currentTime = 0;
                videoEl.play().catch(e => console.log("Video play error:", e));
                videoEl.style.opacity = '1';
                imgEl.style.opacity = '0';
            } else {
                imgEl.src = url;
                imgEl.style.opacity = '1';
                videoEl.style.opacity = '0';
                videoEl.pause();
            }
        }

        function startBgSlideshow() {
            if (bgSlideInterval) clearInterval(bgSlideInterval);
            if (bgImages.length > 0) {
                setAmbientMedia(bgImages[currentBgIndex]);
            }
            bgSlideInterval = setInterval(() => {
                currentBgIndex = (currentBgIndex + 1) % bgImages.length;
                setAmbientMedia(bgImages[currentBgIndex]);
            }, 4000);
        }

        function stopBgSlideshow() {
            if (bgSlideInterval) clearInterval(bgSlideInterval);

                history.pushState({ view: this.currentView, param: this.currentProjectId, modal: type }, '', window.location.href);

                if (type === 'about') {
                    body.innerHTML = `
                        <h2 class="text-2xl font-light tracking-tight mb-6">About Me</h2>
                        <div class="space-y-4 text-neutral-300 font-light leading-relaxed text-base">
                            <p>Siyu Wang vive e lavora tra Milano e la Cina. Laureata all'Accademia di Belle Arti di Brera, la sua ricerca spazia tra installazioni, net art, AR e video sperimentali. Il suo lavoro unisce teoria critica e pratica concreta, traducendo riflessioni sociologiche in installazioni multimediali e interfacce digitali tangibili e immersive.</p>
                            <div class="pt-6 border-t border-white/15 mt-6 grid grid-cols-1 md:grid-cols-2 gap-6 text-xs font-mono text-neutral-400">
                                <div>
                                    <span class="text-white font-semibold block mb-1">ESPERIENZE</span>
                                    2026.01-03 — OBS, Milano · Games Service (Stage)<br>
                                    2025.03 — Brera Open Day 250° · Game & Animation Design<br>
                                    2023.07-09 — DHgate, Pechino · Product Design (Stage)<br>
                                    2023.07 — "Micro-espressioni" · Sistema Interattivo<br>
                                    2020-2022 — BIT Zhuhai · Capo Dipartimento Pratico
                                </div>
                                <div>
                                    <span class="text-white font-semibold block mb-1">FORMAZIONE</span>
                                    B.A. - Beijing Institute of Technology, Zhuhai · Visual Communication Design<br>
                                    M.A. - Accademia di Belle Arti di Brera, Milano · Net Art & Digital Culture
                                </div>
                            </div>
                        </div>
                    `;
                } else if (type === 'contact') {
                    body.innerHTML = `
                        <h2 class="text-2xl font-light tracking-tight mb-6">Contact & Inquiries</h2>
                        <div class="space-y-6 text-neutral-300 font-light text-base">
                            <p>Per opportunità professionali, colloqui o proposte lavorative, potete mettervi in contatto qui:</p>
                            <div class="bg-neutral-900 border-white/15 text-white p-6 border border-white/15 space-y-3 font-mono text-sm text-white/90">
                                <p>Email: <a href="mailto:wsiyu.000@gmail.com" class="underline underline-offset-4 hover:text-white">wsiyu.000@gmail.com</a></p>
                                <p>Instagram: wssiyuu</p>
                                <p>Location: Milan, Italy / China / Remote Worldwide</p>
                            </div>
                        </div>
                    `;
                }

                overlay.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    content.classList.remove('scale-95');
                    content.classList.add('scale-100');
                }, 10);
            },

            closeModal(syncHistory = true) {
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                overlay.classList.add('opacity-0');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);

                if (this.currentView === 'home') {
                    startBgSlideshow();
                }

                // 如果是通过点击 [Close] 或遮罩关闭，同步回退历史栈
                if (syncHistory && history.state && history.state.modal) {
                    history.back();
                }
            }
        };

        window.onload = function() {
            router.init();
        };

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') {
                router.closeModal();
            }
        });

        ['click', 'mousemove', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
            window.addEventListener(evt, () => {
                if (!isAudioInitialized) {
                    playSoundscape('rain');
                }
            }, { once: true });
        });
    </script>
</body>
</html>
